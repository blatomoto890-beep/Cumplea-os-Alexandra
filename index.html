<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7c9e5">
  <title>Una sorpresa para Ale 💗</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 15%,#ffe8f5,transparent 35%),linear-gradient(135deg,#f8d7ed,#e8dcff 55%,#fce8ef);font-family:system-ui,sans-serif;color:#633e66;text-align:center}
    .loader{max-width:440px;padding:30px 26px;background:#fff9;border:1px solid #fff;border-radius:26px;box-shadow:0 16px 50px #9c6b9b25}
    .loader .cats{font-size:42px;letter-spacing:8px}
    h1{font-size:clamp(1.4rem,5vw,2rem);margin:12px 0 8px}
    p{line-height:1.6}
    .paw{display:inline-block;animation:bounce 1s infinite alternate}
    @keyframes bounce{to{transform:translateY(-7px) rotate(8deg)}}
    .error{display:none;color:#8d315d}
  </style>
</head>
<body>
  <main class="loader" id="loader">
    <div class="cats">🐱 🐾 🐈‍⬛</div>
    <h1>Preparando una sorpresa para Ale</h1>
    <p>Un momento… los gatitos están acomodando los globos <span class="paw">💗</span></p>
    <p class="error" id="error">No se pudo cargar la tarjeta. Revisa tu conexión e inténtalo de nuevo.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/less@4.2.0/dist/less.min.js"></script>
  <script>
  (async function(){
    const zipUrl = "https://raw.githubusercontent.com/blatomoto890-beep/Cumplea-os-Alexandra/main/Birthday-master.zip";
    try {
      const response = await fetch(zipUrl);
      if (!response.ok) throw new Error("No se pudo descargar el proyecto original");
      const zip = await JSZip.loadAsync(await response.arrayBuffer());
      const root = "Birthday-master/";
      const getText = async name => {
        const file = zip.file(root + name);
        if (!file) throw new Error("Falta el archivo " + name);
        return file.async("string");
      };
      const urls = {};
      for (const name of Object.keys(zip.files)) {
        const file = zip.files[name];
        if (file.dir || !name.startsWith(root)) continue;
        const base = name.slice(root.length);
        const blob = await file.async("blob");
        const type = base.endsWith(".mp3") ? "audio/mpeg" : base.endsWith(".png") ? "image/png" : base.endsWith(".jpg") ? "image/jpeg" : "application/octet-stream";
        urls[base] = URL.createObjectURL(new Blob([blob], {type}));
      }

      let html = await getText("index.html");
      let effectJs = await getText("effect.js");
      effectJs = effectJs.replace("if(i==50)", "if(i==47)").replace('$(".message")', '$(".message")').replace('$("p:nth-child(49)")', '$("p:nth-child(46)")');
      urls["effect.js"] = URL.createObjectURL(new Blob([effectJs], {type:"text/javascript"}));

      let css = await getText("stylesheet.css");
      let loadingCss = await getText("loading.css");
      const cakeLess = await getText("cake.less");

      const localUrl = path => urls[path.replace(/^\.\//,"")] || path;
      const rewriteCss = source => source.replace(/url\((['"]?)([^'")]+)\1\)/g, (all, quote, path) => {
        const clean = path.trim();
        return clean.startsWith("data:") || clean.startsWith("http") ? all : 'url("' + localUrl(clean) + '")';
      });
      css = rewriteCss(css);
      loadingCss = rewriteCss(loadingCss);
      const cake = await less.render(cakeLess);

      html = html.replace(/<title>[^<]*<\/title>/i, "<title>¡Feliz cumpleaños, Ale! 💗</title>");
      html = html.replace(/Sapthesh V/g, "Ale");
      html = html.replace("A mesage for you", "Un mensaje para ti");
      const spanishMessages = ["Hoy es un día muy especial…","¡porque una personita increíble está de cumpleaños!","Y aunque sea un día como cualquier otro,","hoy merece tener un brillo diferente.","Un año más de historias,","de aprendizajes y de momentos bonitos.","Así que toca celebrar en grande ♡","Preparé esta pequeña sorpresa para ti,","con mucho cariño y algunos michis de compañía.","Gracias por tu amistad,","por las risas y por cada recuerdo compartido.","Espero que nunca te falten motivos para sonreír,","personas que te quieran bonito","y sueños que te emocionen.","Que cada nuevo día te acerque","a todo eso que deseas conseguir.","Que tengas fuerza para los días difíciles,","paciencia para cada proceso","y alegría para disfrutar los pequeños momentos.","Que sigas siendo tú,","con esa forma única de iluminar tus días.","Disfruta mucho cada experiencia,","cada sorpresa y cada nueva aventura.","Rodéate de cosas que te hagan bien,","de música que te encante","y de personas que sumen a tu vida.","Hoy mereces que te celebren,","que te consientan","y que te recuerden lo especial que eres.","Y si algo no sale como esperabas,","recuerda que siempre hay nuevas oportunidades.","Que este año venga cargado de","momentos felices, buenas noticias","y muchísimas razones para agradecer.","También espero que nunca falten","los gatitos, las risas y los dulces ♡","Gracias por ser parte de tantos momentos.","Esta sorpresa es pequeña,","pero está hecha con mucho cariño.","¡Sigue brillando a tu manera!","¡Que todos tus deseos encuentren su camino!","Y ahora sí…","una vez más, ¡feliz cumpleaños, Ale!","¡Que tengas un día precioso!","¡Disfruta muchísimo tu día!","Con mucho cariño ♡"];
      html = html.replace(/(<div class="row message">\\s*<div class="col-md-12">)[\\s\\S]*?(<\\/div>\\s*<\\/div>)/, (_, start, end) => start + spanishMessages.map(message => "<p>" + message + "</p>").join("") + end);
      const buttonLabels = {turn_on:"Encender las luces ✨",play:"Reproducir música ♫",bannar_coming:"Decorar la sorpresa 🎀",balloons_flying:"¡A volar, globitos! 🎈",cake_fadein:"Mostrar el pastel 🎂",light_candle:"Encender la velita 🕯️",wish_message:"Pedir un deseo 💗",story:"Un mensajito para ti ♡"};
      for (const [id, label] of Object.entries(buttonLabels)) {
        const re = new RegExp('(<button[^>]*id="' + id + '"[^>]*>)[\\s\\S]*?(<\\/button>)');
        html = html.replace(re, "$1" + label + "$2");
      }
      const balloonLetters = ["A","L","E","♡","♡","♡","♡"];
      balloonLetters.forEach((letter, index) => {
        const id = "b" + (index + 1);
        const re = new RegExp('(<div class="balloons text-center" id="' + id + '">[\\s\\S]*?<h2[^>]*>)[\\s\\S]*?(<\\/h2>)');
        html = html.replace(re, "$1" + letter + "$2");
      });
      html = html.replace('<img src="banner.png" class="bannar">', '<div class="bannar custom-banner"><span class="banner-kicker">UN DÍA PARA CELEBRAR</span><strong>¡Feliz cumpleaños, Ale!</strong><small>Que hoy esté lleno de magia, risas y cosas bonitas ♡</small></div>');
      html = html.replace(/¡purrfect day!/g, "¡día perfecto!");
      html = html.replace(/miau, miau ♡/g, "miau, miau ♡");

      html = html.replace(/<link rel="stylesheet" type="text\/css" href="stylesheet\.css">/i, "<style>" + css + "</style>");
      html = html.replace(/<link rel="stylesheet" type="text\/css" href="loading\.css">/i, "<style>" + loadingCss + "</style>");
      html = html.replace(/<link rel="stylesheet\/less" href="cake\.less">/i, "<style>" + cake.css + "</style>");
      html = html.replace(/<script src="\/\/cdnjs\.cloudflare\.com\/ajax\/libs\/less\.js\/2\.1\.0\/less\.min\.js"><\/script>/i, "");
      html = html.replace(/href='http:\/\/fonts\.googleapis\.com/g, "href='https://fonts.googleapis.com");
      html = html.replace(/src="hbd\.mp3"/g, 'src="' + urls["hbd.mp3"] + '"');
      html = html.replace(/src="effect\.js"/g, 'src="' + urls["effect.js"] + '"');
      html = html.replace(/src="([^"]+\.(?:png|jpg|jpeg|ico))"/g, (all, path) => 'src="' + localUrl(path) + '"');

      const catExtras = `
      <div class="alex-cat-parade" aria-label="Gatitos kawaii y gatitos reales para Ale">
        <div class="alex-kawaii-cat"><span>😺</span><small>miau, miau ♡</small></div>
        <div class="alex-real-cat"><img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=420&q=85" alt="Gatito real de pelaje atigrado"><small>michi bonito ♡</small></div>
        <div class="alex-kawaii-cat dark"><span>🐈‍⬛</span><small>¡purrfect day!</small></div>
        <div class="alex-real-cat second"><img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=420&q=85" alt="Otro gatito real sentado"><small>otro michi ♡</small></div>
        <div class="alex-kawaii-cat"><span>🐾</span><small>patitas mágicas</small></div>
      </div>`;
      html = html.replace('<div class="row cake-cover">', catExtras + '<div class="row cake-cover">');

      html = html.replace("</head>", `
      <style>
        .custom-banner{width:min(92vw,760px);min-height:170px;margin:28px auto 18px;padding:26px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:linear-gradient(135deg,#fff7fb,#f4e8ff);border:3px solid #f3b9dc;border-radius:30px;box-shadow:0 12px 30px #8f5b8c25;transform:translateY(-500px)}
        .custom-banner.bannar-come{animation:bannar_come linear 6s;transform:translate(0,0)}
        .custom-banner .banner-kicker{font:700 11px system-ui,sans-serif;letter-spacing:3px;color:#b16b9e}
        .custom-banner strong{font:800 clamp(27px,6vw,48px)/1.1 system-ui,sans-serif;color:#87528b;text-shadow:2px 3px 0 #f8d7ec}
        .custom-banner small{font:500 clamp(13px,3vw,17px) system-ui,sans-serif;color:#946b91}
        .message{font-family:system-ui,sans-serif!important;color:#704b78!important;font-size:clamp(17px,4vw,22px);line-height:1.65}
        .message p{padding:0 12px}
        .navbar-fixed-bottom{background:linear-gradient(transparent,#fff7 35%,#fff9);padding:8px 0}
        .navbar-fixed-bottom button{white-space:normal;margin:4px;border:0;border-radius:22px;background:linear-gradient(135deg,#c77db2,#9877c9);font-weight:700;padding:10px 13px;box-shadow:0 4px 12px #744a8425}
        .alex-cat-parade{gap:10px;margin:22px auto 125px;max-width:650px}
        .alex-kawaii-cat,.alex-real-cat{width:105px;min-height:112px;border-radius:22px;padding:9px;background:linear-gradient(145deg,#fffafd,#f3eaff);border:2px solid #f1c6e5;box-shadow:0 7px 18px #7d4b7d18}
        .alex-kawaii-cat span{font-size:43px}
        .alex-real-cat img{width:72px;height:72px;border:3px solid #f5cce6}
        .alex-kawaii-cat small,.alex-real-cat small{font-size:10px}
        @media(max-width:600px){.custom-banner{min-height:145px;margin:20px auto 10px;padding:20px 12px}.navbar-fixed-bottom{max-height:34vh;overflow-y:auto}.navbar-fixed-bottom button{font-size:12px;padding:8px 10px}.alex-cat-parade{margin-bottom:115px}}
        .alex-cat-parade{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin:34px auto 110px;padding:0 12px;max-width:850px}
        .alex-kawaii-cat,.alex-real-cat{width:126px;min-height:136px;padding:12px 10px;border-radius:24px;background:linear-gradient(145deg,#fff7fc,#f1e5ff);border:2px solid #f4c6e6;box-shadow:0 8px 22px #7d4b7d20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;transform:rotate(-3deg);animation:alex-cat-float 3.2s ease-in-out infinite alternate}
        .alex-kawaii-cat span{font-size:54px;line-height:1.1;filter:drop-shadow(0 4px 2px #b47da633)}
        .alex-kawaii-cat small,.alex-real-cat small{font:600 12px system-ui,sans-serif;color:#915d88}
        .alex-kawaii-cat.dark{transform:rotate(3deg);background:linear-gradient(145deg,#f5edff,#eadcff);animation-delay:.7s}
        .alex-real-cat{transform:rotate(2deg);background:#fff;animation-delay:1.1s}
        .alex-real-cat.second{transform:rotate(-2deg);animation-delay:1.6s}
        .alex-real-cat img{width:88px;height:88px;object-fit:cover;border-radius:50%;border:4px solid #f5cce6}
        @keyframes alex-cat-float{from{translate:0 0}to{translate:0 -9px}}
        @media(max-width:600px){.alex-cat-parade{gap:9px;margin-bottom:125px}.alex-kawaii-cat,.alex-real-cat{width:98px;min-height:112px;padding:8px}.alex-kawaii-cat span{font-size:42px}.alex-real-cat img{width:68px;height:68px}.alex-kawaii-cat small,.alex-real-cat small{font-size:10px}}
      </style></head>`);
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      const el = document.getElementById("error");
      if (el) { el.style.display = "block"; el.textContent = "Error: " + (error && error.message ? error.message : String(error)); }
      console.error(error);
    }
  })();
  </script>
</body>
</html>
